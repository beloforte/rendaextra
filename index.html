<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar de Renda Extra</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1D9D6C;--blue:#28A7F8;--ink:#16202e;--muted:#68758a;
  --bg:#f4f7fb;--card:#fff;--line:#e3e9f2;--radius:14px;
  --shadow:0 1px 2px rgba(16,32,52,.06),0 8px 24px -14px rgba(16,32,52,.25);
  --red:#e04b4b;--amber:#e0a33b;
}
html,body{height:100%}
body{font-family:Figtree,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}

/* ---------- Auth ---------- */
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth-left{background:linear-gradient(135deg,#0e3b2c,#0e1a2b 60%,#0b2b46);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.auth-brand{display:flex;align-items:center;gap:12px}
.auth-brand .logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#1D9D6C,#28A7F8);display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px}
.auth-brand h1{font-size:17px;font-weight:800;letter-spacing:-.2px}
.auth-left h2{font-size:34px;font-weight:800;line-height:1.15;letter-spacing:-1px;margin-bottom:20px;max-width:460px}
.auth-feats{display:flex;flex-direction:column;gap:14px;max-width:420px}
.auth-feat{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:#c9d5e6}
.auth-feat .ico{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.08);display:grid;place-items:center;flex:0 0 32px}
.auth-foot{font-size:13px;color:#8fa1ba}
.auth-right{display:grid;place-items:center;padding:32px}
.auth-card{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:var(--shadow)}
.auth-card h3{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px}
.auth-card p.sub{color:var(--muted);font-size:14px;margin-bottom:22px}
.auth-card .input{margin-bottom:12px}
.auth-switch{margin-top:16px;font-size:13.5px;color:var(--muted);text-align:center}
.auth-switch button{background:none;border:0;color:var(--blue);font-weight:700;cursor:pointer;text-decoration:underline}
.auth-msg{margin-top:12px;font-size:13px;padding:10px 12px;border-radius:9px;display:none}
.auth-msg.err{display:block;background:#fdeaea;color:#c53b3b}
.auth-msg.ok {display:block;background:#e4f6ee;color:#137a52}

/* ---------- Sidebar ---------- */
.sidebar{width:252px;flex:0 0 252px;background:#0e1a2b;padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#1D9D6C,#28A7F8);display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;flex:0 0 38px}
.brand h1{font-size:15px;font-weight:800;color:#fff;line-height:1.15;letter-spacing:-.2px}
.brand span{font-size:11.5px;color:#7c8ba3;font-weight:500}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;border:0;background:transparent;color:#a9b6c9;font-weight:600;font-size:14.5px;border-radius:10px;cursor:pointer;text-align:left;transition:.15s}
.nav-btn:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-btn.active{background:linear-gradient(90deg,rgba(29,157,108,.28),rgba(40,167,248,.22));color:#fff}
.nav-btn .ico{width:20px;text-align:center;font-size:15px}
.nav-btn .pill{margin-left:auto;background:rgba(255,255,255,.14);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px}
.side-user{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.side-user .avatar{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#1D9D6C,#28A7F8);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex:0 0 32px}
.side-user .info{flex:1;min-width:0}
.side-user .info b{font-size:12.5px;color:#fff;font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-user .info span{font-size:11px;color:#7c8ba3}
.side-user .out{border:0;background:rgba(255,255,255,.08);color:#a9b6c9;width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:13px}
.side-user .out:hover{background:rgba(255,255,255,.15);color:#fff}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;padding:26px 30px 70px}
.wrap{max-width:1100px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head h2{font-size:25px;font-weight:800;letter-spacing:-.5px}
.page-head p{color:var(--muted);font-size:13.5px;margin-top:2px}

/* ---------- Components ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,#1D9D6C,#28A7F8);color:#fff}
.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:#eef2f8;color:var(--ink)}
.btn-ghost:hover{background:#e3e9f2}
.btn-danger{background:#fdeaea;color:var(--red)}
.btn-danger:hover{background:#fbdcdc}
.btn-sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn .spin{width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat .lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.stat .val{font-size:27px;font-weight:800;margin-top:5px;letter-spacing:-.8px}
.stat .sub{font-size:12.5px;color:var(--muted);margin-top:2px}

.section-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:26px 0 12px;display:flex;align-items:center;gap:9px}
.section-title:first-child{margin-top:0}

.idea-row{display:flex;align-items:center;gap:16px;padding:15px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:.12s}
.idea-row:last-child{border-bottom:0}
.idea-row:hover{background:#fafcff}
.idea-main{flex:1;min-width:0}
.idea-main h4{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.idea-main p{font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:2.5px 9px;border-radius:20px;background:#eef2f8;color:#4b5a72}
.tag.digital{background:#e6f0fe;color:#1f6fd0}
.tag.fisico{background:#fdf0e3;color:#b06d16}
.tag.warn{background:#fdeaea;color:#c53b3b}
.tag.ok{background:#e4f6ee;color:#137a52}
.tag.analise{background:#fdf4dd;color:#9a7413}

.score{flex:0 0 auto;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:19px;letter-spacing:-.5px;border:3px solid;background:#fff}
.score.s-high{border-color:#1D9D6C;color:#137a52}
.score.s-mid{border-color:#28A7F8;color:#1f6fd0}
.score.s-low{border-color:#e0a33b;color:#9a7413}
.score.s-bad{border-color:#e04b4b;color:#c53b3b}
.score small{font-size:10px;font-weight:700;display:block;text-align:center;margin-top:-3px;color:var(--muted)}

.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field .hint{font-size:12px;color:var(--muted);font-weight:500;margin-left:5px}
.input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 13px;background:#fff;outline:none;transition:.15s}
.input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(40,167,248,.13)}
textarea{resize:vertical;min-height:80px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:.13s;color:#4b5a72}
.chip:hover{border-color:#c3d2e6}
.chip.on{background:linear-gradient(135deg,#1D9D6C,#28A7F8);border-color:transparent;color:#fff}

.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filters .input,.filters select{width:auto;flex:1;min-width:150px}

.detail-hero{padding:24px;border-radius:var(--radius);background:linear-gradient(135deg,#0e1a2b,#17324d);color:#fff;margin-bottom:20px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.detail-hero h3{font-size:23px;font-weight:800;letter-spacing:-.4px}
.detail-hero p{color:#a9b6c9;font-size:13.5px;margin-top:5px;max-width:620px}
.crit{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.crit:last-child{border-bottom:0}
.crit .cname{flex:0 0 190px;font-weight:700;font-size:14px}
.crit .cname small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.crit .bar{flex:1;height:9px;background:#eef2f8;border-radius:20px;overflow:hidden;min-width:80px}
.crit .bar i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,#1D9D6C,#28A7F8)}
.crit .pts{flex:0 0 74px;text-align:right;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}

.plan{margin-bottom:16px;overflow:hidden}
.plan-head{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;background:#fff}
.plan-head:hover{background:#fafcff}
.plan-head h4{font-size:16px;font-weight:700;flex:1}
.plan-body{border-top:1px solid var(--line);padding:14px 18px 18px;background:#fbfcfe}
.step{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px dashed var(--line)}
.step:last-of-type{border-bottom:0}
.step input[type=checkbox]{width:19px;height:19px;accent-color:#1D9D6C;cursor:pointer;flex:0 0 19px}
.step .step-title{flex:1;border:1.5px solid transparent;background:transparent;border-radius:8px;padding:6px 9px;font-size:14px;font-weight:600;min-width:0}
.step .step-title:hover{background:#fff;border-color:var(--line)}
.step .step-title:focus{background:#fff;border-color:var(--blue);outline:none}
.step input[type=date]{border:1.5px solid transparent;background:transparent;border-radius:8px;padding:5px 8px;font-size:13px;font-weight:600;color:#4b5a72;width:140px;flex:0 0 140px}
.step input[type=date]:hover{background:#fff;border-color:var(--line)}
.step.done .step-title{text-decoration:line-through;color:#98a4b6}
.step .ico-btn{border:0;background:transparent;cursor:pointer;font-size:15px;padding:5px 7px;border-radius:8px;opacity:.45;transition:.13s}
.step .ico-btn:hover{opacity:1;background:#eef2f8}
.step .ico-btn.on{opacity:1}
.due-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.due-late{background:#fdeaea;color:#c53b3b}
.due-soon{background:#fdf4dd;color:#9a7413}

.rem{display:flex;align-items:center;gap:13px;padding:12px 16px;border-bottom:1px solid var(--line)}
.rem:last-child{border-bottom:0}
.rem .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.rem .dot.late{background:var(--red)}
.rem .dot.soon{background:var(--amber)}
.rem .txt{flex:1;min-width:0}
.rem .txt b{font-size:14px;font-weight:700;display:block}
.rem .txt span{font-size:12.5px;color:var(--muted)}

.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:8px;opacity:.5}
.empty p{font-size:13.5px;max-width:380px;margin:0 auto}

.modal-bg{position:fixed;inset:0;background:rgba(10,20,34,.55);backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px;z-index:100;overflow-y:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:0 24px 70px -20px rgba(0,0,0,.5);max-height:92vh;overflow-y:auto;animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0;z-index:2}
.modal-head h3{font-size:18px;font-weight:800}
.modal-body{padding:22px 24px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff;border-radius:0 0 16px 16px}
.x{border:0;background:#eef2f8;width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:16px;color:#68758a}
.x:hover{background:#e3e9f2}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#0e1a2b;color:#fff;padding:12px 20px;border-radius:11px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transition:.25s;z-index:200;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{background:#7a1a1a}

.loading-screen{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:300;color:var(--muted);font-size:14px}
.loading-screen .spin{width:28px;height:28px;border:3px solid #d8e0ec;border-top-color:#1D9D6C;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}

@media(max-width:860px){
  .auth-wrap{grid-template-columns:1fr}
  .auth-left{display:none}
  .app{flex-direction:column}
  .sidebar{width:100%;flex:none;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px;gap:6px;align-items:center}
  .brand{padding:0 12px 0 4px;flex:0 0 auto}
  .brand span{display:none}
  .nav-btn{width:auto;flex:0 0 auto;padding:9px 13px;font-size:13.5px}
  .nav-btn .pill{display:none}
  .side-user{margin-top:0;border-top:0;padding:0 8px;flex:0 0 auto}
  .side-user .info{display:none}
  .main{padding:18px 16px 60px}
  .grid2{grid-template-columns:1fr}
  .crit .cname{flex:0 0 130px;font-size:13px}
  .page-head h2{font-size:21px}
  .step input[type=date]{width:120px;flex:0 0 120px}
}
</style>
</head>

const $  = s => document.querySelector(s);

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = v => 'R$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});
const todayISO = () => new Date().toISOString().slice(0,10);
function addDays(iso, n){ const d = new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function diffDays(iso){
  const a = new Date(todayISO()+'T12:00:00');
  const b = new Date(iso+'T12:00:00');
  return Math.round((b-a)/86400000);
}
const fmtDate = iso => { if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; };
const scoreClass = n => n>=75?'s-high':n>=55?'s-mid':n>=40?'s-low':'s-bad';

function toast(msg, kind=''){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (kind==='err' ? ' err' : '');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), 2600);
}
function normSkills(str){
  return String(str||'').split(/[,;]/).map(s=>s.trim().toLowerCase()).filter(Boolean).join(', ');
}
function skillsArr(str){
  return String(str||'').split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
}

function renderAuth(){
  $('#boot').style.display = 'none';
  $('#root').innerHTML = `
    <div class="auth-wrap">
      <div class="auth-left">
        <div class="auth-brand">
          <div class="logo">R</div>
          <div><h1>Radar de Renda Extra</h1></div>

            <div class="auth-feat"><div class="ico">📋</div><div>Planos com etapas, prazos e lembretes para cada ideia aprovada.</div></div>
            <div class="auth-feat"><div class="ico">🗂️</div><div>Histórico de descartes que evita sugerir ideias parecidas.</div></div>
          </div>
        </div>
        <div class="auth-foot">Mercado digital e produtos físicos, no mesmo radar.</div>
      </div>
      <div class="auth-right">
        <div class="auth-card">
          <h3 id="auth-title">Entrar</h3>
          <p class="sub" id="auth-sub">Acesse com seu e-mail para ver suas oportunidades.</p>
          <input class="input" id="auth-email" type="email" placeholder="seu@email.com" autocomplete="email">
          <input class="input" id="auth-pass" type="password" placeholder="Senha (mín. 6 caracteres)" autocomplete="current-password">
          <button class="btn btn-primary" id="auth-go" style="width:100%;justify-content:center;margin-top:6px">Entrar</button>
          <div class="auth-msg" id="auth-msg"></div>
          <div class="auth-switch">
            <span id="auth-switch-txt">Ainda não tem conta?</span>
            <button id="auth-switch-btn" type="button">Criar conta</button>
          </div>
        </div>
      </div>
    </div>`;

  let mode = 'login';
  const setMode = m => {
    mode = m;
    $('#auth-title').textContent = m==='login' ? 'Entrar' : 'Criar conta';
    $('#auth-sub').textContent   = m==='login' ? 'Acesse com seu e-mail para ver suas oportunidades.' : 'Crie sua conta para começar o radar.';
    $('#auth-go').textContent    = m==='login' ? 'Entrar' : 'Criar conta';
    $('#auth-switch-txt').textContent = m==='login' ? 'Ainda não tem conta?' : 'Já tem conta?';
    $('#auth-switch-btn').textContent = m==='login' ? 'Criar conta' : 'Entrar';
    $('#auth-pass').setAttribute('autocomplete', m==='login' ? 'current-password' : 'new-password');
    showMsg('');
  };
  const showMsg = (m, kind='err') => {
    const el = $('#auth-msg');
    if(!m){ el.className = 'auth-msg'; el.textContent=''; return; }
    el.className = 'auth-msg ' + kind; el.textContent = m;
  };
  const setBusy = b => {
    const b1 = $('#auth-go');
    b1.disabled = b;
    if(b) b1.innerHTML = '<span class="spin"></span> Aguarde…';
    else b1.textContent = mode==='login' ? 'Entrar' : 'Criar conta';
  };

  $('#auth-switch-btn').addEventListener('click', () => setMode(mode==='login'?'signup':'login'));

  const submit = async () => {
    const email = $('#auth-email').value.trim();
    const pass  = $('#auth-pass').value;
    if(!email || !pass){ showMsg('Preencha e-mail e senha.'); return; }
    if(pass.length < 6){ showMsg('Senha precisa ter ao menos 6 caracteres.'); return; }
    setBusy(true); showMsg('');
    try{
      if(mode==='login'){
        const { error } = await sb.auth.signInWithPassword({ email, password: pass });
        if(error) throw error;
      } else {
        const { data, error } = await sb.auth.signUp({ email, password: pass });
        if(error) throw error;
        if(!data.session){
          showMsg('Conta criada. Confirme seu e-mail e depois faça login.', 'ok');
          setBusy(false);
          setMode('login');
          return;
        }
      }
    } catch(err){
      const msg = String(err.message||err);
      showMsg(
        msg.includes('Invalid login') ? 'E-mail ou senha incorretos.' :
        msg.includes('already registered') ? 'Este e-mail já está cadastrado. Faça login.' :
        msg
      );
      setBusy(false);
    }
  };

  $('#auth-go').addEventListener('click', submit);
  $('#auth-pass').addEventListener('keydown', e => { if(e.key==='Enter') submit(); });
  $('#auth-email').addEventListener('keydown', e => { if(e.key==='Enter') $('#auth-pass').focus(); });
  $('#auth-email').focus();
}

async function loadAll(){
  const uid = state.user.id;
  const [perfilR, ideiasR, planosR, etapasR] = await Promise.all([
    sb.from('perfil').select('*').eq('usuario_id', uid).maybeSingle(),
    sb.from('ideias').select('*').eq('usuario_id', uid).order('id'),
    sb.from('planos').select('*').eq('usuario_id', uid).order('id'),
    sb.from('etapas').select('*').order('ordem')
  ]);
  if(perfilR.error) throw perfilR.error;
  if(ideiasR.error) throw ideiasR.error;
  if(planosR.error) throw planosR.error;
  if(etapasR.error) throw etapasR.error;

  state.perfil = perfilR.data || null;
  state.ideias = ideiasR.data || [];
  state.planos = planosR.data || [];
  state.etapas = {};

  // agrupa etapas por plano
  const planoIds = new Set(state.planos.map(p=>p.id));
  (etapasR.data||[]).forEach(e=>{
    if(planoIds.has(e.plano_id)){
      (state.etapas[e.plano_id] = state.etapas[e.plano_id] || []).push(e);
    }
  });
}

async function seedSeVazio(){
  if(state.ideias.length > 0) return;
  const uid = state.user.id;
  const rows = SEED_IDEIAS.map(i => ({
    usuario_id: uid,
    titulo: i.titulo,
    categoria: i.categoria,
    segmento: i.segmento,
    descricao: i.descricao,
    investimento_min: i.investimento_min,
    horas_semana: i.horas_semana,
    habilidades: normSkills(i.habilidades),
    concorrencia: i.concorrencia,
    mercado: i.mercado,
    retorno_estimado: i.retorno_estimado,
    status: 'NOVA'
  }));
  const { error } = await sb.from('ideias').insert(rows);
  if(error){ toast('Erro ao preparar ideias iniciais: '+error.message, 'err'); return; }
  await loadAll();
}

async function mudarStatusIdeia(id, novoStatus, motivo){
  const payload = { status: novoStatus };
  if(novoStatus === 'DESCARTADA'){
    payload.motivo_descarte = motivo || '';
    payload.descartada_em = new Date().toISOString();
  } else {
    payload.motivo_descarte = null;
    payload.descartada_em = null;
  }
  const { data, error } = await sb.from('ideias').update(payload).eq('id', id).eq('usuario_id', state.user.id).select().single();
  if(error) throw error;
  const i = state.ideias.findIndex(x=>x.id===id);
  if(i>=0) state.ideias[i] = data;

  // Se descartou, cancela plano associado
  if(novoStatus === 'DESCARTADA'){
    const plano = state.planos.find(p=>p.ideia_id===id && (p.status==='ATIVO'||p.status==='PAUSADO'));
    if(plano){
      await sb.from('planos').update({status:'CANCELADO'}).eq('id', plano.id).eq('usuario_id', state.user.id);
      plano.status = 'CANCELADO';
    }
  }
  return data;
}

/* ---------- Planos ---------- */
async function criarPlano(ideiaId){
  const uid = state.user.id;
  // Cria plano
  const { data: plano, error: e1 } = await sb.from('planos')
    .insert({ usuario_id: uid, ideia_id: ideiaId, status: 'ATIVO', inicio: todayISO() })
    .select().single();
  if(e1) throw e1;

  // Cria etapas padrão
  const base = todayISO();
  const etapas = DEFAULT_STEPS.map((t, i) => ({
    plano_id: plano.id,
    titulo: t,
    prazo: addDays(base, DEFAULT_DIAS[i]),
    ordem: i+1,
    concluida: false,
    lembrete: true
  }));
  const { data: etapasData, error: e2 } = await sb.from('etapas').insert(etapas).select();
  if(e2) throw e2;

  // Atualiza status da ideia para EM_EXECUCAO
  const { data: ideiaUpd, error: e3 } = await sb.from('ideias')
    .update({ status: 'EM_EXECUCAO' })
    .eq('id', ideiaId).eq('usuario_id', uid).select().single();
  if(e3) throw e3;

  // Atualiza estado local
  state.planos.push(plano);
  state.etapas[plano.id] = etapasData;
  const i = state.ideias.findIndex(x=>x.id===ideiaId);
  if(i>=0) state.ideias[i] = ideiaUpd;
  state.ui.planOpen[plano.id] = true;
  return plano;
}

async function mudarStatusPlano(planoId, novoStatus){
  const { data, error } = await sb.from('planos')
    .update({ status: novoStatus })
    .eq('id', planoId).eq('usuario_id', state.user.id).select().single();
  if(error) throw error;
  const p = state.planos.find(x=>x.id===planoId);
  if(p) p.status = data.status;

  // Propaga para a ideia
  const novoStatusIdeia =
    novoStatus === 'CONCLUIDO' ? 'CONCLUIDA' :
    novoStatus === 'CANCELADO' ? 'NOVA' :
    novoStatus === 'PAUSADO' ? 'EM_ANALISE' :
    'EM_EXECUCAO';

  if(p){
    const { data: ideiaUpd } = await sb.from('ideias')
      .update({ status: novoStatusIdeia })
      .eq('id', p.ideia_id).eq('usuario_id', state.user.id).select().single();
    const i = state.ideias.findIndex(x=>x.id===p.ideia_id);
    if(i>=0 && ideiaUpd) state.ideias[i] = ideiaUpd;
  }

  // Se concluir plano, marca todas as etapas como feitas
  if(novoStatus === 'CONCLUIDO'){
    await sb.from('etapas').update({ concluida: true }).eq('plano_id', planoId);
    (state.etapas[planoId]||[]).forEach(e=>e.concluida = true);
  }
}

async function excluirPlano(planoId){
  const p = state.planos.find(x=>x.id===planoId);
  if(!p) return;
  const { error } = await sb.from('planos').delete().eq('id', planoId).eq('usuario_id', state.user.id);
  if(error) throw error;
  state.planos = state.planos.filter(x=>x.id!==planoId);
  delete state.etapas[planoId];
  // Volta status da ideia para NOVA se não tiver outro plano ativo
  const outro = state.planos.find(x=>x.ideia_id===p.ideia_id && (x.status==='ATIVO'||x.status==='PAUSADO'));
  if(!outro){
    const { data: ideiaUpd } = await sb.from('ideias')
      .update({ status: 'NOVA' }).eq('id', p.ideia_id).eq('usuario_id', state.user.id).select().single();
    const i = state.ideias.findIndex(x=>x.id===p.ideia_id);
    if(i>=0 && ideiaUpd) state.ideias[i] = ideiaUpd;
  }
}

/* ---------- Etapas ---------- */
async function adicionarEtapa(planoId, titulo, prazo){
  const atuais = state.etapas[planoId] || [];
  const ordem = atuais.length ? Math.max(...atuais.map(e=>e.ordem)) + 1 : 1;
  const { data, error } = await sb.from('etapas').insert({
    plano_id: planoId,
    titulo: titulo.trim(),
    prazo: prazo || null,
    ordem,
    concluida: false,
    lembrete: true
  }).select().single();
  if(error) throw error;
  (state.etapas[planoId] = state.etapas[planoId] || []).push(data);
  return data;
}

async function atualizarEtapa(id, campos){
  const { data, error } = await sb.from('etapas').update(campos).eq('id', id).select().single();
  if(error) throw error;
  for(const pid in state.etapas){
    const i = state.etapas[pid].findIndex(e=>e.id===id);
    if(i>=0){ state.etapas[pid][i] = data; break; }
  }
  return data;
}

async function removerEtapa(id){
  const { error } = await sb.from('etapas').delete().eq('id', id);
  if(error) throw error;
  for(const pid in state.etapas){
    state.etapas[pid] = state.etapas[pid].filter(e=>e.id!==id);
  }
}

  const hrs = (p.horas_semana  === null || p.horas_semana  === undefined || p.horas_semana  === '') ? 10   : Number(p.horas_semana);

    skills: skillsArr(p.habilidades),
    usandoPadrao: (p.investimento===null||p.investimento===undefined||p.investimento==='') ||
                  (p.horas_semana ===null||p.horas_semana ===undefined||p.horas_semana ==='')
  };
}

}

function calcularNota(ideia){
  const { inv, hrs, skills } = perfilVals();
  const segDesc = segmentosDescartados();

  // Investimento — 30
  const invMin = Number(ideia.investimento_min)||0;
  const sInv = invMin <= 0 ? 30 : 30 * Math.min(1, inv / invMin);

  // Tempo — 20
  const hSem = Math.max(1, Number(ideia.horas_semana)||1);
  const sTime = 20 * Math.min(1, hrs / hSem);

  // Habilidades — 20
  const reqs = skillsArr(ideia.habilidades);
  let sSkill, faltando = [];
  if(reqs.length === 0){ sSkill = 20; }
  else {
    faltando = reqs.filter(r => !skills.includes(r));
    sSkill = 20 * ((reqs.length - faltando.length) / reqs.length);
  }

  // Concorrência — 15 (menor = melhor)
  const comp = Math.min(5, Math.max(1, Number(ideia.concorrencia)||3));
  const sComp = 15 * (5 - comp) / 4;

  // Mercado — 15
  const mkt = Math.min(5, Math.max(1, Number(ideia.mercado)||3));
  const sMarket = 15 * (mkt - 1) / 4;

  let total = sInv + sTime + sSkill + sComp + sMarket;
  const penalizado = ideia.status !== 'DESCARTADA' && segDesc.has((ideia.segmento||'').toLowerCase());
  if(penalizado) total -= 20;
  total = Math.max(0, Math.min(100, Math.round(total)));

  return {
    total, penalizado,
    partes: [
      {label:'Investimento', max:30, pts:sInv,
       nota:`Você tem ${money(inv)} · a ideia pede ${invMin>0?money(invMin):'nada'}`},
      {label:'Tempo livre', max:20, pts:sTime,
       nota:`Você tem ${hrs}h/semana · a ideia pede ${hSem}h`},
      {label:'Habilidades', max:20, pts:sSkill,
       nota: reqs.length ? (faltando.length ? 'Faltam: '+faltando.join(', ') : 'Você tem todas') : 'Sem exigências específicas'},
      {label:'Concorrência', max:15, pts:sComp,
       nota:`Nível ${comp}/5 ${comp>=4?'(alta)':comp<=2?'(baixa)':'(média)'}`},
      {label:'Tamanho do mercado', max:15, pts:sMarket,
       nota:`Nível ${mkt}/5 ${mkt>=4?'(amplo)':mkt<=2?'(nicho)':'(médio)'}`}
    ]
  };
}

/* =========================================================================
   8. DADOS DERIVADOS
   ========================================================================= */
function ideiasOrdenadas(){
  return state.ideias
    .filter(i=>i.status!=='DESCARTADA')
    .map(i=>({idea:i, sc:calcularNota(i)}))
    .sort((a,b)=>b.sc.total - a.sc.total);
}
function planoDaIdeia(ideiaId){
  return state.planos.find(p=>p.ideia_id===ideiaId && (p.status==='ATIVO'||p.status==='PAUSADO'));
}
function etapasPendentes(){
  const out = [];
  state.planos.forEach(p=>{
    if(p.status!=='ATIVO') return;
    const ideia = state.ideias.find(i=>i.id===p.ideia_id);
    if(!ideia || ideia.status === 'DESCARTADA') return;
    (state.etapas[p.id]||[]).forEach(e=>{
      if(!e.concluida && e.prazo && e.lembrete){
        out.push({plano:p, etapa:e, dias:diffDays(e.prazo)});
      }
    });
  });
  return out.sort((a,b)=>a.dias - b.dias);
}

        <button class="btn btn-ghost btn-sm" data-action="add-step" data-plan="${p.id}">+ Adicionar</button>
      </div>

      <div style="display:flex;gap:9px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap">
        ${p.status==='ATIVO'   ? `<button class="btn btn-ghost btn-sm" data-action="pausar" data-plan="${p.id}">⏸ Pausar plano</button>` : ''}
        ${p.status==='PAUSADO' ? `<button class="btn btn-ghost btn-sm" data-action="reativar" data-plan="${p.id}">▶ Retomar plano</button>` : ''}
        ${p.status!=='CONCLUIDO' && p.status!=='CANCELADO' ? `<button class="btn btn-primary btn-sm" data-action="concluir" data-plan="${p.id}">🏁 Concluir plano</button>` : ''}
        <button class="btn btn-danger btn-sm" data-action="del-plan" data-plan="${p.id}" style="margin-left:auto">Excluir plano</button>
      </div>
    </div>` : ''}
  </div>`;
}

function stepHTML(p, e){
  const badge = (()=>{
    if(e.concluida || !e.prazo) return '';
    const d = diffDays(e.prazo);
    if(d < 0) return `<span class="due-badge due-late">${Math.abs(d)}d atrasada</span>`;
    if(d <= 7) return `<span class="due-badge due-soon">${d===0?'hoje':d+'d'}</span>`;
    return '';
  })();
  return `
  <div class="step ${e.concluida?'done':''}">
    <input type="checkbox" ${e.concluida?'checked':''} data-action="toggle-step" data-plan="${p.id}" data-step="${e.id}">
    <input class="step-title" value="${esc(e.titulo)}" data-action="edit-title" data-step="${e.id}">
    ${badge}
    <input type="date" value="${e.prazo||''}" data-action="edit-due" data-step="${e.id}">
    <button class="ico-btn ${e.lembrete?'on':''}" title="${e.lembrete?'Lembrete ligado':'Lembrete desligado'}"
            data-action="toggle-rem" data-step="${e.id}">${e.lembrete?'🔔':'🔕'}</button>
    <button class="ico-btn" title="Remover etapa" data-action="del-step" data-step="${e.id}">✕</button>
  </div>`;
}

function viewDescartadas(){
  const list = state.ideias.filter(i=>i.status==='DESCARTADA')
    .sort((a,b)=>(b.descartada_em||'').localeCompare(a.descartada_em||''));

  return `
  <div class="page-head">
    <div><h2>Histórico de descartadas</h2><p>Ideias do mesmo segmento destas passam a receber 20 pontos a menos na nota.</p></div>
  </div>

  ${list.length ? `
  <div class="card">
    ${list.map(i=>{
      const sameSeg = state.ideias.filter(x=>x.segmento===i.segmento && x.status!=='DESCARTADA').length;
      return `
      <div style="padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap">
        <div style="flex:1;min-width:220px">
          <h4 style="font-size:15.5px;font-weight:700">${esc(i.titulo)}</h4>
          <div class="tags" style="margin-top:6px">
            <span class="tag">${esc(i.segmento)}</span>
            <span class="tag">descartada em ${fmtDate((i.descartada_em||'').slice(0,10))}</span>
          </div>
          <div style="margin-top:10px;font-size:13.5px;background:#f7f9fc;border-left:3px solid #cfd9e8;padding:9px 12px;border-radius:0 8px 8px 0">
            <b style="font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)">Motivo</b><br>
            ${esc(i.motivo_descarte || '—')}
          </div>
          ${sameSeg ? `<div style="font-size:12.5px;color:var(--muted);margin-top:8px">${sameSeg} ideia(s) do mesmo segmento ainda no banco (com −20 pontos).</div>` : ''}
        </div>
        <button class="btn btn-ghost btn-sm" data-action="restaurar" data-id="${i.id}">↩ Trazer de volta</button>
      </div>`;
    }).join('')}
  </div>` : `<div class="card">${emptyHTML('Nenhuma ideia descartada. Quando descartar uma, ela aparece aqui com o motivo.')}</div>`}
  `;
}

/* =========================================================================
   11. RENDER PRINCIPAL
   ========================================================================= */
function render(){
  if(!state.user) return;
  const shell = `
    <div class="app">
      <aside class="sidebar" id="nav">${renderNav()}</aside>
      <main class="main"><div class="wrap" id="view"></div></main>
    </div>`;
  $('#root').innerHTML = shell;

  const v = $('#view');
  switch(state.ui.screen){
    case 'painel':      v.innerHTML = viewPainel(); break;
    case 'banco':       v.innerHTML = viewBanco(); break;
    case 'detalhe':     v.innerHTML = viewDetalhe(); break;
    case 'perfil':      v.innerHTML = viewPerfil(); break;
    case 'execucao':    v.innerHTML = viewExecucao(); break;
    case 'descartadas': v.innerHTML = viewDescartadas(); break;
    default:            v.innerHTML = viewPainel();
  }
}

function go(screen, ideaId){
  state.ui.screen = screen;
  if(ideaId !== undefined) state.ui.ideaId = ideaId;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* =========================================================================
   12. MODAIS
   ========================================================================= */
function openModal(html){
  $('#modal-root').innerHTML = `<div class="modal-bg" data-bg><div class="modal" data-modal>${html}</div></div>`;
}
function closeModal(){ $('#modal-root').innerHTML = ''; }

function modalDescarte(id){
  const idea = state.ideias.find(i=>i.id===id);
  if(!idea) return;
  openModal(`
    <div class="modal-head">
      <h3>Descartar ideia</h3>
      <button class="x" data-action="close-modal">✕</button>
    </div>
    <div class="modal-body">
      <p style="font-size:14px;color:var(--muted);margin-bottom:16px">
        <b style="color:var(--ink)">${esc(idea.titulo)}</b> vai para o histórico. Ideias futuras do segmento
        <b style="color:var(--ink)">${esc(idea.segmento)}</b> perdem 20 pontos.
        ${planoDaIdeia(id) ? '<br><br><b style="color:var(--red)">O plano em execução desta ideia será cancelado.</b>' : ''}
      </p>
      <div class="field">
        <label>Por que você está descartando?</label>
        <textarea id="desc-reason" placeholder="Ex.: concorrência muito alta, não tenho fornecedor, investimento fora do meu bolso..."></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-action="close-modal">Cancelar</button>
      <button class="btn btn-danger" data-action="confirmar-descarte" data-id="${id}">Descartar</button>
    </div>
  `);
  setTimeout(()=>$('#desc-reason')?.focus(), 50);
}

  const i = editing || {titulo:'',categoria:'',segmento:'',descricao:'',investimento_min:0,horas_semana:8,habilidades:'',concorrencia:3,mercado:3,retorno_estimado:''};

    <div class="modal-head">

    </div>

      <div class="grid2">
        <div class="field">
          <label>Categoria</label>
          <input class="input" id="fi-categoria" value="${esc(i.categoria)}" placeholder="Ex.: Serviços digitais">
        </div>

          <label>Segmento</label>
          <input class="input" id="fi-segmento" list="seg-list" value="${esc(i.segmento)}" placeholder="Ex.: Educação">

        </div>
      </div>
      <div class="field">
        <label>Descrição curta</label>
        <textarea id="fi-desc" placeholder="Como funciona e para quem é?">${esc(i.descricao)}</textarea>
      </div>
      <div class="grid2">
        <div class="field">
          <label>Investimento inicial <span class="hint">R$</span></label>
          <input class="input" type="number" min="0" step="50" id="fi-inv" value="${i.investimento_min||0}">
        </div>
        <div class="field">
          <label>Horas por semana</label>
          <input class="input" type="number" min="1" max="168" step="1" id="fi-hours" value="${i.horas_semana||8}">
        </div>
      </div>

          <select id="fi-comp">${[1,2,3,4,5].map(n=>`<option value="${n}"${i.concorrencia===n?' selected':''}>${n}</option>`).join('')}</select>

/* =========================================================================
   13. AÇÕES
   ========================================================================= */
async function aprovarIdeia(id){
  try{
    state.ui.busy = true;
    await criarPlano(id);
    toast('Ideia aprovada! Plano criado com 5 etapas.');
    go('execucao');
  } catch(err){
    toast('Erro ao aprovar: '+err.message, 'err');
  } finally {
    state.ui.busy = false;
  }
}

async function salvarIdeiaDoModal(id){
  const titulo = $('#fi-titulo').value.trim();
  if(!titulo){ toast('Dê um título para a ideia.','err'); return; }
  const segmento = $('#fi-segmento').value.trim();
  if(!segmento){ toast('Informe o segmento.','err'); return; }
  const dados = {
    titulo,
    categoria: $('#fi-categoria').value.trim() || 'Outros',
    segmento,
    descricao: $('#fi-desc').value,
    investimento_min: $('#fi-inv').value,
    horas_semana: $('#fi-hours').value,
    concorrencia: $('#fi-concorrencia')?.value || $('#fi-comp').value,
    mercado: $('#fi-market').value,
    retorno_estimado: $('#fi-retorno').value,
    habilidades: [...$$('#fi-skills .chip.on')].map(b=>b.dataset.skill).join(', ')
  };
  try{
    if(id){ await editarIdeia(id, dados); toast('Ideia atualizada.'); }
    else   { await criarIdeia(dados);       toast('Ideia adicionada.'); }
    closeModal();
    render();
  } catch(err){ toast(err.message,'err'); }
}

/* =========================================================================
   14. EVENTOS GLOBAIS
   ========================================================================= */
document.addEventListener('click', async e => {
  // Fechar modal pelo fundo
  if(e.target.matches('[data-bg]')){ closeModal(); return; }

  const el = e.target.closest('[data-action]');
  if(!el) return;
  // Se clicou dentro de um modal e não é ação, não propaga
  const inModal = !!e.target.closest('[data-modal]');
  const a = el.dataset.action;

  switch(a){
    case 'nav': go(el.dataset.screen); break;
    case 'logout': logout(); break;
    case 'ver-ideia': go('detalhe', Number(el.dataset.id)); break;
    case 'nova-ideia': modalIdeia(null); break;
    case 'editar-ideia': modalIdeia(Number(el.dataset.id)); break;
    case 'salvar-ideia': salvarIdeiaDoModal(el.dataset.id ? Number(el.dataset.id) : null); break;
    case 'close-modal': closeModal(); break;
    case 'fi-toggle-skill': el.classList.toggle('on'); break;
    case 'abrir-descarte': modalDescarte(Number(el.dataset.id)); break;

    case 'aprovar': aprovarIdeia(Number(el.dataset.id)); break;

    case 'analise': {
      const idea = state.ideias.find(i=>i.id===Number(el.dataset.id));
      const novo = idea.status==='EM_ANALISE' ? 'NOVA' : 'EM_ANALISE';
      try{ await mudarStatusIdeia(idea.id, novo); render(); toast(novo==='EM_ANALISE'?'Marcada como em análise.':'Voltou para o banco.'); }
      catch(err){ toast(err.message,'err'); }
      break;
    }

    case 'confirmar-descarte': {
      const id = Number(el.dataset.id);
      const motivo = ($('#desc-reason')?.value||'').trim();
      if(!motivo){ toast('Escreva o motivo do descarte.','err'); return; }
      try{
        await mudarStatusIdeia(id, 'DESCARTADA', motivo);
        closeModal(); render(); toast('Ideia descartada e guardada no histórico.');
      } catch(err){ toast(err.message,'err'); }
      break;
    }

    case 'restaurar': {
      try{
        await mudarStatusIdeia(Number(el.dataset.id), 'NOVA');
        render(); toast('Ideia trazida de volta ao banco.');
      } catch(err){ toast(err.message,'err'); }
      break;
    }

    case 'toggle-plan': {
      const id = Number(el.dataset.id);
      state.ui.planOpen[id] = !state.ui.planOpen[id];
      render();
      break;
    }

    case 'toggle-step': {
      const eid = Number(el.dataset.step);
      const et = Object.values(state.etapas).flat().find(x=>x.id===eid);
      if(!et) return;
      try{ await atualizarEtapa(eid, { concluida: !et.concluida }); render(); if(!et.concluida) toast('Etapa concluída!'); }
      catch(err){ toast(err.message,'err'); }
      break;
    }

    case 'toggle-rem': {
      const eid = Number(el.dataset.step);
      const et = Object.values(state.etapas).flat().find(x=>x.id===eid);
      if(!et) return;
      try{ await atualizarEtapa(eid, { lembrete: !et.lembrete }); render(); toast(!et.lembrete?'Lembrete ligado.':'Lembrete desligado.'); }
      catch(err){ toast(err.message,'err'); }
      break;
    }

    case 'del-step': {
      const eid = Number(el.dataset.step);
      if(!confirm('Remover esta etapa?')) return;
      try{ await removerEtapa(eid); render(); toast('Etapa removida.'); }
      catch(err){ toast(err.message,'err'); }
      break;
    }

    case 'add-step': {
      const pid = Number(el.dataset.plan);
      const titulo = $('#new-step-'+pid)?.value.trim();
      const prazo = $('#new-due-'+pid)?.value || null;
      if(!titulo){ toast('Escreva o nome da etapa.','err'); return; }
      try{ await adicionarEtapa(pid, titulo, prazo); render(); toast('Etapa adicionada.'); }
      catch(err){ toast(err.message,'err'); }
      break;
    }

    case 'pausar':
    case 'reativar':
    case 'concluir': {
      const pid = Number(el.dataset.plan);
      const novo = a==='pausar' ? 'PAUSADO' : a==='reativar' ? 'ATIVO' : 'CONCLUIDO';
      try{
        await mudarStatusPlano(pid, novo);
        render();
        toast(novo==='PAUSADO'?'Plano pausado.':novo==='ATIVO'?'Plano retomado.':'🏁 Plano concluído!');
      } catch(err){ toast(err.message,'err'); }
      break;
    }

    case 'del-plan': {
      const pid = Number(el.dataset.plan);
      if(!confirm('Excluir este plano? A ideia volta para o banco.')) return;
      try{ await excluirPlano(pid); render(); toast('Plano excluído.'); }
      catch(err){ toast(err.message,'err'); }
      break;
    }

    case 'toggle-skill': {
      el.classList.toggle('on');
      break;
    }

    case 'add-skill': {
      const inp = $('#new-skill');
      const v = (inp.value||'').trim();
      if(!v) return;
      const key = v.toLowerCase();
      if($$('#p-skills .chip').length && [...$$('#p-skills .chip')].some(c=>c.dataset.skill===key)){ inp.value=''; return; }
      const btn = document.createElement('button');
      btn.type='button'; btn.className='chip on'; btn.dataset.action='toggle-skill'; btn.dataset.skill=key;
      btn.textContent = key + ' ✕';
      $('#p-skills').appendChild(btn);
      inp.value = '';
      break;
    }

    case 'reset-perfil': {
      if(!confirm('Limpar todos os dados do perfil?')) return;
      try{ await salvarPerfil({ investimento:'', horas_semana:'', habilidades:'', experiencia:'' }); render(); toast('Perfil limpo.'); }
      catch(err){ toast(err.message,'err'); }
      break;
    }

    case 'salvar-perfil': {
      const skills = [...$$('#p-skills .chip.on')].map(b=>b.dataset.skill).join(', ');
      try{
        await salvarPerfil({
          investimento: $('#p-invest').value,
          horas_semana: $('#p-hours').value,
          habilidades: skills,
          experiencia: $('#p-exp').value
        });
        render();
        toast('Perfil salvo.');
      } catch(err){ toast(err.message,'err'); }
      break;
    }
  }
});

document.addEventListener('change', e => {
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;
  if(a==='f-tipo')     { state.ui.tipo = el.value; render(); }
  else if(a==='f-segmento'){ state.ui.segmento = el.value; render(); }
  else if(a==='f-sort')    { state.ui.sort = el.value; render(); }
  else if(a==='edit-due'){
    const eid = Number(el.dataset.step);
    atualizarEtapa(eid, { prazo: el.value || null }).then(render).catch(err=>toast(err.message,'err'));
  }
});

document.addEventListener('input', e => {
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;
  if(a==='f-query'){
    state.ui.query = el.value;
    // re-renderiza só a lista para não perder foco
    const active = document.activeElement;
    const pos = active?.selectionStart;
    render();
    const newInput = document.querySelector('[data-action="f-query"]');
    if(newInput){ newInput.focus(); try{ newInput.setSelectionRange(pos,pos); }catch(_){} }
  }
});

// Fechar modal com ESC
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeModal();
});

   15. BOOT

async function startApp(){
  $('#boot').style.display = 'flex';
  $('#boot').innerHTML = '<div><div class="spin"></div>Carregando seus dados…</div>';
  try{
    await loadAll();
    await seedSeVazio();
    await loadAll();
    $('#boot').style.display = 'none';
    render();
  } catch(err){
    $('#boot').innerHTML = `<div style="max-width:520px;text-align:center;padding:24px">
      <div style="font-size:34px;margin-bottom:8px">⚠️</div>
      <b style="color:#16202e">Não consegui carregar seus dados</b>
      <p style="margin-top:8px;font-size:13.5px;color:#68758a">${esc(err.message)}</p>
      <p style="margin-top:8px;font-size:12px;color:#98a4b6">Verifique se o SQL do schema foi executado no Supabase e se as políticas RLS estão ativas.</p>
      <button class="btn btn-ghost" style="margin-top:14px" onclick="location.reload()">Tentar novamente</button>
    </div>`;
  }
}
